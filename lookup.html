<main class="cart-page lookup-page" id="lookupPage">
  <h1 class="cart-page__title">查詢訂單</h1>

  <div class="lookup-columns">
    <form class="lookup-form" id="lookupForm">
      <div class="field field--text">
        <label class="field__row">
          <span class="field__label">Email</span>
          <input type="email" class="field__input" id="lookupEmail" autocomplete="email" required>
        </label>
      </div>
      <div class="field field--text">
        <label class="field__row">
          <span class="field__label">收件人電話</span>
          <input type="tel" class="field__input" id="lookupPhone" autocomplete="tel" required>
        </label>
      </div>
      <button type="submit" class="submit-btn" id="lookupBtn">查詢</button>
    </form>

    <p class="lookup-divider">或</p>

    <form class="lookup-form" id="lookupByIdForm">
      <div class="field field--text">
        <label class="field__row">
          <span class="field__label">訂單編號</span>
          <input type="text" class="field__input" id="lookupOrderId" autocomplete="off" required>
        </label>
      </div>
      <button type="submit" class="submit-btn" id="lookupByIdBtn">查詢</button>
    </form>
  </div>

  <p class="cart-error" id="lookupError" hidden></p>
  <p class="lookup-empty" id="lookupEmpty" hidden>查無符合的訂單，請確認 Email 與收件人電話是否正確。</p>

  <div id="lookupResults"></div>
</main>
